<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LABPIN - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-left">
      <img src="assets/images/logo.png" alt="LABPIN" class="logo">
      <h1>Selamat Datang di LABPIN</h1>
      <p>Sistem Peminjaman Alat Laboratorium untuk Mahasiswa</p>
    </div>

    <div class="login-right">
      <form id="loginForm" class="login-form">
        <h2>Login</h2>
        <p class="subtitle">Masuk atau daftar akun LABPIN Anda</p>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Email" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Password" required>
        </div>

        <div class="form-group">
          <label>Nomor WhatsApp</label>
          <input type="tel" id="whatsapp" placeholder="08xxxxxxxxxx" 
                 pattern="08[0-9]{8,11}" required>
          <small>Digunakan untuk verifikasi akun</small>
        </div>

        <div class="form-group checkbox">
          <input type="checkbox" id="isAdmin">
          <label for="isAdmin">Login sebagai Admin</label>
        </div>

        <button type="submit" class="btn-primary">Login / Daftar</button>

        <div class="admin-link">
          <a href="#" id="adminBtn">🔐 Login Khusus Admin</a>
        </div>
      </form>

      <!-- Admin Login Modal -->
      <div id="adminModal" class="modal hidden">
        <div class="modal-content">
          <h3>Login Admin</h3>
          <input type="text" id="adminUser" placeholder="Username">
          <input type="password" id="adminPass" placeholder="Password">
          <div class="modal-buttons">
            <button id="adminLoginBtn" class="btn-primary">Masuk</button>
            <button id="adminCloseBtn" class="btn-secondary">Batal</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
